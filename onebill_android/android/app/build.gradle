plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.onesolutionagency.onebill"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.onesolutionagency.onebill"
        minSdk = 23            // serious_python (embedded Python) needs 23+
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true   // Python native libraries must be extracted
        }
    }

    buildTypes {
        release {
            // Debug key so "flutter build apk --release" works without a keystore.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
